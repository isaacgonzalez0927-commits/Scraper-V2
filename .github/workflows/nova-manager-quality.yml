name: Nova manager quality

on:
  push:
    branches:
      - nova/autonomous-growth-manager
  pull_request:
    paths:
      - 'lib/nova/**'
      - 'lib/nexus/**'
      - 'app/api/nova/**'
      - 'components/nova/**'
      - 'tests/**'
      - 'lib/schema.ts'
      - 'lib/db.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
