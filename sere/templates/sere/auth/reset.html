<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New password · Sere</title>
  <link rel="stylesheet" href="{{ url_for('sere.static', filename='css/sere.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
</head>
<body class="auth-shell">
  <div class="auth-card">
    <h1 class="page-title" style="font-size:28px">Choose a new password</h1>
    <form method="post" class="form-grid" style="grid-template-columns:1fr;margin-top:18px">
      <div class="field"><label>New password</label><input name="password" type="password" minlength="8" required></div>
      <button class="btn" type="submit">Update password</button>
    </form>
  </div>
</body>
</html>
