<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create company · Sere</title>
  <link rel="stylesheet" href="{{ url_for('sere.static', filename='css/sere.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
</head>
<body class="auth-shell">
  <div class="auth-card">
    <a class="brand" href="/"><span class="brand-mark">S</span><span class="brand-name">Sere</span></a>
    <h1 class="page-title" style="font-size:28px;margin:8px 0 6px">Create your company</h1>
    <p class="page-sub">Your jobs and invoices stay on this organization. Teammates can be added later.</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}<div class="flash flash-{{ category }}">{{ message }}</div>{% endfor %}
    {% endwith %}
    <form method="post" class="form-grid" style="grid-template-columns:1fr;margin-top:18px">
      <div class="field"><label>Your name</label><input name="name" required></div>
      <div class="field"><label>Work email</label><input name="email" type="email" required></div>
      <div class="field"><label>Password</label><input name="password" type="password" minlength="8" required></div>
      <div class="field"><label>Company name</label><input name="company" placeholder="Harbor Air" required></div>
      <button class="btn" type="submit">Create company</button>
    </form>
    <p class="tiny" style="margin-top:16px"><a href="{{ url_for('sere.login') }}">I already have an account</a></p>
  </div>
</body>
</html>
