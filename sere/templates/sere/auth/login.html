<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Sere</title>
  <link rel="stylesheet" href="{{ url_for('sere.static', filename='css/sere.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
</head>
<body class="auth-shell">
  <div class="auth-card">
    <a class="brand" href="/"><span class="brand-mark">S</span><span class="brand-name">Sere</span></a>
    <h1 class="page-title" style="font-size:28px;margin:8px 0 6px">Sign in</h1>
    <p class="page-sub">Welcome back.</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash flash-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    <form method="post" class="form-grid" style="grid-template-columns:1fr;margin-top:18px">
      <div class="field"><label>Email</label><input name="email" type="email" value="owner@sere.cash" required></div>
      <div class="field"><label>Password</label><input name="password" type="password" value="harborair" required></div>
      <button class="btn" type="submit">Sign in</button>
    </form>
    <p class="tiny" style="margin-top:16px">
      Demo company: Harbor Air · <code>owner@sere.cash</code> / <code>harborair</code><br>
      <a href="{{ url_for('sere.forgot') }}">Forgot password</a> ·
      <a href="{{ url_for('sere.signup') }}">Create a company</a>
    </p>
  </div>
</body>
</html>
