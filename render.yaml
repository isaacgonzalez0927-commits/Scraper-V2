services:
  - type: web
    name: sere
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 180
    envVars:
      - key: SERE_SECRET_KEY
        sync: false
      - key: SERE_PUBLIC_BASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.6"

